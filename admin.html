<!DOCTYPE html>
<html>
<head>
<title>NAVCOREX ADMIN</title>

<style>

body{

}

h1{
color:cyan;
}

textarea{
width:100%;

</head>

<body>
<div class="login-box">

<h1>NAVCOREX</h1>
<h2>ADMIN PANEL</h2>

<p>Secure Firebase Admin Access</p>

<button id="loginBtn">Login with Google</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRfu07ltKWZTSqBxfCc-PA8BrTROnQBWo",
  authDomain: "navcorex-ai.firebaseapp.com",
  projectId: "navcorex-ai",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

document.getElementById("loginBtn").onclick = () => {
  signInWithPopup(auth, provider)
    .then((result) => {

      if(result.user.email !== "navneet9915129074@gmail.com"){
        alert("Access Denied");
        auth.signOut();
      } else {
        alert("Welcome Admin 🔥");
        document.getElementById("adminPanel").style.display = "block";
      }

    });
};

onAuthStateChanged(auth, (user) => {
  if(user && user.email === "navneet9915129074@gmail.com"){
    document.getElementById("adminPanel").style.display = "block";
  }
});
</script>
  
<div id="adminPanel" style="display:none;">
<h1>NAVCOREX ADMIN PANEL</h1>

<h3>Edit Announcement</h3>

<textarea id="announcementText"></textarea>

<button onclick="saveData()">Save</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBRfu07ltKWZTSqBxfCc-PA8BrTROnQBWo",
    authDomain: "navcorex-ai.firebaseapp.com",
    databaseURL: "https://navcorex-ai-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "navcorex-ai",
    storageBucket: "navcorex-ai.firebasestorage.app",
    messagingSenderId: "230540410498",
    appId: "1:230540410498:web:dd08a233621a43ad6c7e9b",
    measurementId: "G-6HT0B7EX70"
  };

const app = initializeApp(firebaseConfig);

const db = getDatabase();

const announcementRef = ref(db, 'announcement');

onValue(announcementRef, (snapshot)=>{

document.getElementById("announcementText").value = snapshot.val();

});

window.saveData = function(){

const text =
document.getElementById("announcementText").value;

set(ref(db,'announcement'), text);

alert("Saved Successfully");

}

</script>
</div>
